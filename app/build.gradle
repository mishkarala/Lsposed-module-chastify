plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.bridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.bridge"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Подключаем наш локальный модуль вместо поиска библиотеки в интернете
    compileOnly project(':libxposed-compat')
}
